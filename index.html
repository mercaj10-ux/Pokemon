<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* =========================================================================
   GEN III (ADV) — Battle Frontier damage calculator, set-based.
   Two Pokémon, real stats from Base/IV/EV/Nature, 4 moves each, both ways.
   ========================================================================= */

const TYPE_COLOR = {
  Normal: "#9a9a6f", Fire: "#e8752e", Water: "#4d84e0", Electric: "#e6bb28",
  Grass: "#5fb84a", Ice: "#78cccc", Fighting: "#b52d24", Poison: "#8f3d9c",

const TYPES = Object.keys(TYPE_COLOR);
const PHYSICAL = new Set(["Normal","Fighting","Flying","Poison","Ground","Rock","Bug","Ghost","Steel"]);

// Gen III type chart (Steel resists Ghost & Dark; no Fairy)
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5},
  Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
  Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
  Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},
  Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
  Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
  Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
  Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
  Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Dragon:{Dragon:2},
  Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5},
};
const oneMult = (a,d)=> (!d||d==="None")?1:(CHART[a]?.[d]===undefined?1:CHART[a][d]);
const applyType = (b,m)=> m===0?0: m===2?b*2: m===.5?Math.floor(b/2): b;

// species: [types], base [hp,atk,def,spa,spd,spe], default ability
const S = (t,b,abil="None")=>({types:t,base:{hp:b[0],atk:b[1],def:b[2],spa:b[3],spd:b[4],spe:b[5]},abil});
const SPECIES = {
  Salamence:S(["Dragon","Flying"],[95,135,80,110,80,100]),
  Metagross:S(["Steel","Psychic"],[80,135,130,95,90,70]),
  Snorlax:S(["Normal","None"],[160,110,65,65,110,30],"Thick Fat"),
  Blissey:S(["Normal","None"],[255,10,10,75,135,55]),
  Suicune:S(["Water","None"],[100,75,115,90,115,85]),
  Raikou:S(["Electric","None"],[90,85,75,115,100,115]),
  Entei:S(["Fire","None"],[115,115,85,90,75,100]),
  Gengar:S(["Ghost","Poison"],[60,65,60,130,75,110],"Levitate"),
  Starmie:S(["Water","Psychic"],[60,75,85,100,85,115]),
  Tyranitar:S(["Rock","Dark"],[100,134,110,95,100,61]),
  Skarmory:S(["Steel","Flying"],[65,80,140,40,70,70]),
  Swampert:S(["Water","Ground"],[100,110,90,85,90,60]),
  Gyarados:S(["Water","Flying"],[95,125,79,60,100,81]),
  Dragonite:S(["Dragon","Flying"],[91,134,95,100,100,80]),
  Aerodactyl:S(["Rock","Flying"],[80,105,65,60,75,130]),
  Alakazam:S(["Psychic","None"],[55,50,45,135,95,120]),
  Heracross:S(["Bug","Fighting"],[80,125,75,40,95,85],"Guts"),
  Jolteon:S(["Electric","None"],[65,65,60,110,95,130]),
  Zapdos:S(["Electric","Flying"],[90,90,85,125,90,100]),
  Articuno:S(["Ice","Flying"],[90,85,100,95,125,85]),
  Moltres:S(["Fire","Flying"],[90,100,90,125,85,90]),
  Latias:S(["Dragon","Psychic"],[80,80,90,110,130,110]),
  Latios:S(["Dragon","Psychic"],[80,90,80,130,110,110]),
  Kingdra:S(["Water","Dragon"],[75,95,95,95,95,85]),
  Milotic:S(["Water","None"],[95,60,79,100,125,81],"Marvel Scale"),
  Regice:S(["Ice","None"],[80,50,100,100,200,50]),
  Regirock:S(["Rock","None"],[80,100,200,50,100,50]),
  Registeel:S(["Steel","None"],[80,75,150,75,150,50]),
  Claydol:S(["Ground","Psychic"],[60,70,105,70,120,75],"Levitate"),
  Flygon:S(["Ground","Dragon"],[80,100,80,80,80,100],"Levitate"),
  Walrein:S(["Ice","Water"],[110,80,90,95,90,65]),
  Slaking:S(["Normal","None"],[150,160,100,95,65,100]),
  Charizard:S(["Fire","Flying"],[78,84,78,109,85,100]),
  Blaziken:S(["Fire","Fighting"],[80,120,70,110,70,80]),
  Sceptile:S(["Grass","None"],[70,85,65,105,85,120]),
  Swellow:S(["Normal","Flying"],[60,85,60,50,50,125]),
  Umbreon:S(["Dark","None"],[95,65,110,60,130,65]),
  Espeon:S(["Psychic","None"],[65,65,60,130,95,110]),
  Machamp:S(["Fighting","None"],[90,130,80,65,85,55],"Guts"),
  Gardevoir:S(["Psychic","None"],[68,65,65,125,115,80]),
  Ludicolo:S(["Water","Grass"],[80,70,70,90,100,70]),
  Weezing:S(["Poison","None"],[65,90,120,85,70,60],"Levitate"),
  Forretress:S(["Bug","Steel"],[75,90,140,60,60,40]),
  Donphan:S(["Ground","None"],[90,120,120,60,60,50]),
  Marowak:S(["Ground","None"],[60,80,110,50,80,45]),
  Medicham:S(["Fighting","Psychic"],[60,60,75,60,75,80],"Pure Power"),
  Breloom:S(["Grass","Fighting"],[60,130,80,60,60,70]),
  Hariyama:S(["Fighting","None"],[144,120,60,40,60,50],"Guts"),
  Vaporeon:S(["Water","None"],[130,65,60,110,95,65]),
  Flareon:S(["Fire","None"],[65,130,60,95,110,65]),
};
const SPECIES_LIST = Object.keys(SPECIES).sort();

// moves with Gen III base power (category derived from type)
const MV = (n,t,p)=>({name:n,type:t,power:p});
const MOVES = [
  MV("Earthquake","Ground",100),MV("Rock Slide","Rock",75),MV("Body Slam","Normal",85),
  MV("Return","Normal",102),MV("Double-Edge","Normal",120),MV("Hyper Beam","Normal",150),
  MV("Extreme Speed","Normal",80),MV("Shadow Ball","Ghost",80),MV("Crunch","Dark",80),
  MV("Meteor Mash","Steel",100),MV("Iron Tail","Steel",100),MV("Aerial Ace","Flying",60),
  MV("Drill Peck","Flying",80),MV("Brick Break","Fighting",75),MV("Cross Chop","Fighting",100),
  MV("Sky Uppercut","Fighting",85),MV("Superpower","Fighting",120),MV("Focus Punch","Fighting",150),
  MV("High Jump Kick","Fighting",85),MV("Megahorn","Bug",120),MV("Silver Wind","Bug",60),
  MV("Sludge Bomb","Poison",90),MV("Dragon Claw","Dragon",80),MV("Outrage","Dragon",90),
  MV("Dragon Breath","Dragon",60),MV("Waterfall","Water",80),MV("Surf","Water",95),
  MV("Hydro Pump","Water",120),MV("Ice Beam","Ice",95),MV("Blizzard","Ice",120),
  MV("Thunderbolt","Electric",95),MV("Thunder","Electric",120),MV("Flamethrower","Fire",95),
  MV("Fire Blast","Fire",120),MV("Overheat","Fire",140),MV("Psychic","Psychic",90),
  MV("Giga Drain","Grass",60),MV("Leaf Blade","Grass",70),MV("Solar Beam","Grass",120),
];
const MOVE_MAP = Object.fromEntries(MOVES.map(m=>[m.name,m]));
const MOVE_NAMES = MOVES.map(m=>m.name).sort();

const NATURES = {
  Hardy:[], Lonely:["atk","def"], Brave:["atk","spe"], Adamant:["atk","spa"], Naughty:["atk","spd"],
  Bold:["def","atk"], Docile:[], Relaxed:["def","spe"], Impish:["def","spa"], Lax:["def","spd"],
  Timid:["spe","atk"], Hasty:["spe","def"], Serious:[], Jolly:["spe","spa"], Naive:["spe","spd"],
  Modest:["spa","atk"], Mild:["spa","def"], Quiet:["spa","spe"], Bashful:[], Rash:["spa","spd"],
  Calm:["spd","atk"], Gentle:["spd","def"], Sassy:["spd","spe"], Careful:["spd","spa"], Quirky:[],
};
const NATURE_LIST = Object.keys(NATURES).sort();
const ABILITIES = ["None","Levitate","Thick Fat","Pure Power","Huge Power","Guts","Marvel Scale","Wonder Guard","Flash Fire"];
const ITEMS = ["None","Leftovers","Choice Band","Soul Dew","Thick Club"];
const STATUSES = ["Healthy","Burned","Paralyzed","Poisoned","Badly Poisoned","Asleep","Frozen"];
const STAT_KEYS = ["hp","atk","def","spa","spd","spe"];
const STAT_LABEL = {hp:"HP",atk:"Atk",def:"Def",spa:"SpA",spd:"SpD",spe:"Spe"};

const stageMul = s => s>=0 ? (2+s)/2 : 2/(2-s);

function calcStats(m){
  const b = SPECIES[m.species].base;
  const nat = NATURES[m.nature]||[];
  const nm = s => nat[0]===s?1.1: nat[1]===s?0.9:1;
  const iv = s => m.ivs[s]??31, ev = s => m.evs[s]??0;
  const hp = b.hp===1?1: Math.floor((2*b.hp+iv("hp")+Math.floor(ev("hp")/4))*m.level/100)+m.level+10;
  const mk = s => Math.floor((Math.floor((2*b[s]+iv(s)+Math.floor(ev(s)/4))*m.level/100)+5)*nm(s));
  return {hp, atk:mk("atk"), def:mk("def"), spa:mk("spa"), spd:mk("spd"), spe:mk("spe")};
}

function calcDamage(A, B, mv, crit, weather){
  const zero = {rolls:Array(16).fill(0), min:0, max:0, eff:1, hp:1};
  if(!mv || mv.power<=0) return {...zero, none:true};
  const type = mv.type, physical = PHYSICAL.has(type);

  if(B.ability==="Levitate" && type==="Ground") return {...zero, eff:0, note:"Levitate"};
  if(B.ability==="Flash Fire" && type==="Fire") return {...zero, eff:0, note:"Flash Fire"};

  const aS=calcStats(A), bS=calcStats(B);
  const aT=SPECIES[A.species].types, bT=SPECIES[B.species].types;
  const m1=oneMult(type,bT[0]), m2=oneMult(type,bT[1]||"None"), eff=m1*m2;
  if(eff===0) return {...zero, eff:0, hp:bS.hp};
  if(B.ability==="Wonder Guard" && eff<=1) return {...zero, eff, hp:bS.hp, note:"Wonder Guard"};

  let aStage = A.stages[physical?"atk":"spa"]; if(crit) aStage=Math.max(aStage,0);
  let atk = Math.floor((physical?aS.atk:aS.spa)*stageMul(aStage));
  const aStatused = A.status && A.status!=="Healthy";
  const isLati = s => s==="Latios"||s==="Latias";
  if(physical && (A.ability==="Huge Power"||A.ability==="Pure Power")) atk*=2;
  if(physical && A.ability==="Guts" && aStatused) atk=Math.floor(atk*1.5);
  if(physical && A.item==="Choice Band") atk=Math.floor(atk*1.5);
  if(physical && A.item==="Thick Club" && A.species==="Marowak") atk*=2;
  if(!physical && A.item==="Soul Dew" && isLati(A.species)) atk=Math.floor(atk*1.5);

  let dStage = B.stages[physical?"def":"spd"]; if(crit) dStage=Math.min(dStage,0);
  let def = Math.floor((physical?bS.def:bS.spd)*stageMul(dStage));
  if(physical && B.ability==="Marvel Scale" && B.status && B.status!=="Healthy") def=Math.floor(def*1.5);
  if(!physical && B.item==="Soul Dew" && isLati(B.species)) def=Math.floor(def*1.5);

  const lvl=A.level;
  let base=Math.floor((Math.floor(2*lvl/5)+2)*mv.power*atk/Math.max(1,def));
  base=Math.floor(base/50);

  if(physical && A.status==="Burned" && A.ability!=="Guts") base=Math.floor(base/2);
  const screen = physical ? B.reflect : B.lightScreen;
  if(screen && !crit) base=Math.floor(base/2);
  if(weather==="Sun"){ if(type==="Fire") base=Math.floor(base*3/2); else if(type==="Water") base=Math.floor(base/2); }
  else if(weather==="Rain"){ if(type==="Water") base=Math.floor(base*3/2); else if(type==="Fire") base=Math.floor(base/2); }

  base=base+2;
  if(crit) base=base*2;
  if(aT.includes(type)) base=Math.floor(base*3/2); // STAB
  base=applyType(base,m1); base=applyType(base,m2);
  if(B.ability==="Thick Fat" && (type==="Fire"||type==="Ice")) base=Math.floor(base/2);

  const rolls=[];
  for(let r=85;r<=100;r++){ let d=Math.floor(base*r/100); if(d<1)d=1; rolls.push(d); }
  return {rolls, min:rolls[0], max:rolls[15], eff, hp:bS.hp};
}

function koText(res){
  if(res.none) return "—";
  if(res.eff===0) return res.note ? res.note : "No effect";
  const {min,max,hp}=res;
  if(min>=hp) return "Guaranteed OHKO";
  if(max>=hp) return "Possible OHKO";
  const best=Math.ceil(hp/max), worst=Math.ceil(hp/min);
  return best===worst ? `Guaranteed ${best}HKO` : `${best}–${worst}HKO`;
}

/* ---- styling ---- */
const C={text:"#e9f3ec",muted:"#8bae9c",line:"#20402f",card:"#0f231a",field:"#0a1a12",accent:"#3ee08f"};
const ctl={width:"100%",background:C.field,border:`1px solid ${C.line}`,color:C.text,borderRadius:9,padding:"8px 10px",fontSize:14,outline:"none",boxSizing:"border-box"};
const lbl={display:"block",fontSize:10,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.muted,marginBottom:4};
const cardS={background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:14,marginTop:12};
const mono={fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace"};
const stepBtn={width:26,height:26,borderRadius:7,border:`1px solid ${C.line}`,background:C.field,color:C.text,fontSize:16,fontWeight:800,cursor:"pointer",lineHeight:1};

function Sel({value,onChange,options,style}){
  return <select value={value} onChange={e=>onChange(e.target.value)} style={{...ctl,...style}}>
    {options.map(o=><option key={o} value={o}>{o}</option>)}
  </select>;
}
function Num({value,onChange,style}){
  return <input type="number" inputMode="numeric" value={value}
    onChange={e=>onChange(e.target.value)} style={{...ctl,...style}} />;
}
function Badge({t}){ if(!t||t==="None") return null;
  return <span style={{background:TYPE_COLOR[t],color:"#fff",fontSize:10,fontWeight:800,letterSpacing:".04em",
    textTransform:"uppercase",padding:"2px 8px",borderRadius:999,textShadow:"0 1px 1px rgba(0,0,0,.35)"}}>{t}</span>;
}
function Chk({on,set,children}){
  return <button onClick={()=>set(!on)} style={{display:"inline-flex",alignItems:"center",gap:6,
    background:on?"#123a27":C.field,border:`1px solid ${on?C.accent:C.line}`,color:C.text,
    borderRadius:8,padding:"6px 9px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
    <span style={{width:14,height:14,borderRadius:4,border:`2px solid ${on?C.accent:C.muted}`,
      background:on?C.accent:"transparent",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
      {on&&<span style={{color:"#04140b",fontSize:9,fontWeight:900}}>✓</span>}</span>{children}</button>;
}

function MonCard({mon,onChange,idx}){
  const [showEV,setShowEV]=useState(false);
  const sp=SPECIES[mon.species];
  const stats=calcStats(mon);
  const up=patch=>onChange({...mon,...patch});
  const setStage=(k,v)=>up({stages:{...mon.stages,[k]:Math.max(-6,Math.min(6,v))}});
  const setIV=(k,v)=>up({ivs:{...mon.ivs,[k]:Math.max(0,Math.min(31,parseInt(v||0,10)||0))}});
  const setEV=(k,v)=>up({evs:{...mon.evs,[k]:Math.max(0,Math.min(255,parseInt(v||0,10)||0))}});
  const setMove=(i,patch)=>{const ms=mon.moves.map((m,j)=>j===i?{...m,...patch}:m);up({moves:ms});};
  const changeSpecies=name=>up({species:name, ability:SPECIES[name].abil});

  return <div style={cardS}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <span style={{fontSize:11,fontWeight:900,color:C.accent,letterSpacing:".08em"}}>#{idx}</span>
      <div style={{flex:1}}><Sel value={mon.species} onChange={changeSpecies} options={SPECIES_LIST}/></div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:10}}>{sp.types.map(t=><Badge key={t} t={t}/>)}</div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1.4fr",gap:8}}>
      <div><label style={lbl}>Level</label><Num value={mon.level} onChange={v=>up({level:Math.max(1,Math.min(100,parseInt(v||1,10)||1))})}/></div>
      <div><label style={lbl}>Nature</label><Sel value={mon.nature} onChange={v=>up({nature:v})} options={NATURE_LIST}/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:8}}>
      <div><label style={lbl}>Ability</label><Sel value={mon.ability} onChange={v=>up({ability:v})} options={ABILITIES}/></div>
      <div><label style={lbl}>Item</label><Sel value={mon.item} onChange={v=>up({item:v})} options={ITEMS}/></div>
      <div><label style={lbl}>Status</label><Sel value={mon.status} onChange={v=>up({status:v})} options={STATUSES}/></div>
    </div>

    <div style={{marginTop:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={lbl}>Stats · stage</span>
        <button onClick={()=>setShowEV(s=>!s)} style={{background:"transparent",border:"none",color:C.accent,fontSize:11,fontWeight:700,cursor:"pointer"}}>{showEV?"hide":"edit"} IVs/EVs</button>
      </div>
      {STAT_KEYS.map(k=>(
        <div key={k} style={{display:"flex",alignItems:"center",gap:8,padding:"3px 0"}}>
          <span style={{width:30,fontSize:12,fontWeight:800,color:C.muted}}>{STAT_LABEL[k]}</span>
          <span style={{...mono,width:38,fontSize:15,fontWeight:800}}>{stats[k]}</span>
          {showEV && <>
            <input type="number" value={mon.ivs[k]??31} onChange={e=>setIV(k,e.target.value)} style={{...ctl,width:52,padding:"4px 6px",fontSize:12}} title="IV"/>
            <input type="number" value={mon.evs[k]??0} onChange={e=>setEV(k,e.target.value)} style={{...ctl,width:60,padding:"4px 6px",fontSize:12}} title="EV"/>
          </>}
          {k!=="hp" && !showEV && (
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:2}}>
              <button onClick={()=>setStage(k,mon.stages[k]-1)} style={stepBtn}>−</button>
              <span style={{...mono,width:26,textAlign:"center",fontSize:13,fontWeight:800,
                color:mon.stages[k]>0?C.accent:mon.stages[k]<0?"#e0776a":C.muted}}>
                {mon.stages[k]>0?"+":""}{mon.stages[k]}</span>
              <button onClick={()=>setStage(k,mon.stages[k]+1)} style={stepBtn}>+</button>
            </div>)}
        </div>
      ))}
    </div>

    <div style={{marginTop:12}}>
      <label style={lbl}>Moves</label>
      {mon.moves.map((mv,i)=>(
        <div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
          <div style={{flex:1}}>
            <Sel value={mv.name} onChange={v=>setMove(i,{name:v})} options={["None","Custom",...MOVE_NAMES]}/>
          </div>
          {mv.name==="Custom" ? <>
            <input type="number" value={mv.cPow} onChange={e=>setMove(i,{cPow:e.target.value})} style={{...ctl,width:56,padding:"6px"}} title="Power"/>
            <select value={mv.cType} onChange={e=>setMove(i,{cType:e.target.value})} style={{...ctl,width:96,padding:"6px"}}>
              {TYPES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </> : null}
          <Chk on={mv.crit} set={v=>setMove(i,{crit:v})}>Crit</Chk>
        </div>
      ))}
    </div>

    <div style={{display:"flex",gap:8,marginTop:8}}>
      <Chk on={mon.reflect} set={v=>up({reflect:v})}>Reflect</Chk>
      <Chk on={mon.lightScreen} set={v=>up({lightScreen:v})}>Light Screen</Chk>
    </div>
  </div>;
}

function resolveMove(mv){
  if(!mv||mv.name==="None") return null;
  if(mv.name==="Custom") return {name:"Custom",type:mv.cType,power:parseInt(mv.cPow||0,10)||0};
  return MOVE_MAP[mv.name];
}

function ResultPanel({atk,def,weather,title}){
  return <div style={{...cardS,background:"linear-gradient(160deg,#0f2a1d,#0c2016)",borderColor:"#26543a"}}>
    <div style={{fontSize:12,fontWeight:900,letterSpacing:".04em",marginBottom:10}}>
      {title} <span style={{color:C.accent}}>{atk.species}</span>
      <span style={{color:C.muted}}> → {def.species}</span>
    </div>
    {atk.moves.map((mv,i)=>{
      const move=resolveMove(mv);
      const res=calcDamage(atk,def,move,mv.crit,weather);
      const minP=(res.min/res.hp*100), maxP=(res.max/res.hp*100);
      let color=C.muted;
      if(!res.none){ if(res.eff===0)color="#7a8a82"; else if(res.eff>1)color="#5fe08f"; else if(res.eff<1)color="#e0a24a"; else color=C.text; }
      const rem=Math.max(0,100-maxP), contested=Math.max(0,Math.min(maxP,100)-Math.min(minP,100));
      const hpc=rem>=50?"#3fcf5f":rem>=20?"#f2c53d":"#e0533d";
      return <div key={i} style={{padding:"8px 0",borderTop:i?`1px solid ${C.line}`:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
          <span style={{fontSize:14,fontWeight:700,color:move?C.text:C.muted}}>
            {move?(move.name==="Custom"?`Custom ${move.type} ${move.power}`:move.name):"—"}
            {mv.crit&&move?<span style={{color:"#f2c53d",fontSize:11,fontWeight:800}}> crit</span>:null}
          </span>
          <span style={{...mono,fontSize:14,fontWeight:800,color}}>{res.none?"—":`${res.min}–${res.max}`}</span>
        </div>
        {!res.none && <>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
            <div style={{flex:1,height:9,borderRadius:6,background:"#071009",border:"1px solid #000",overflow:"hidden",display:"flex"}}>
              <div style={{width:`${rem}%`,background:hpc}}/>
              <div style={{width:`${contested}%`,background:"repeating-linear-gradient(45deg,#e0533d,#e0533d 4px,#a83a2c 4px,#a83a2c 8px)"}}/>
            </div>
            <span style={{...mono,fontSize:11,color:C.muted,minWidth:82,textAlign:"right"}}>{minP.toFixed(1)}–{maxP.toFixed(1)}%</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
            <span style={{fontSize:11,fontWeight:700,color}}>{koText(res)}</span>
            <span style={{fontSize:11,color:C.muted}}>×{res.eff}</span>
          </div>
        </>}
      </div>;
    })}
  </div>;
}

function defMon(species,nature,moves){
  return {species,level:50,nature,ability:SPECIES[species].abil,item:"None",status:"Healthy",
    ivs:Object.fromEntries(STAT_KEYS.map(k=>[k,31])),
    evs:Object.fromEntries(STAT_KEYS.map(k=>[k,0])),
    stages:{atk:0,def:0,spa:0,spd:0,spe:0},
    reflect:false,lightScreen:false,
    moves:moves.map(n=>({name:n,crit:false,cPow:80,cType:"Normal"})),
  };
}

function App(){
  const [m1,setM1]=useState(defMon("Salamence","Naughty",["Dragon Claw","Earthquake","Rock Slide","Fire Blast"]));
  const [m2,setM2]=useState(defMon("Metagross","Adamant",["Meteor Mash","Earthquake","Rock Slide","Psychic"]));
  const [weather,setWeather]=useState("None");

  const s1=useMemo(()=>calcStats(m1),[m1]);
  const s2=useMemo(()=>calcStats(m2),[m2]);
  const spd1=Math.floor((m1.status==="Paralyzed"?0.25:1)*s1.spe*stageMul(m1.stages.spe));
  const spd2=Math.floor((m2.status==="Paralyzed"?0.25:1)*s2.spe*stageMul(m2.stages.spe));
  const faster = spd1===spd2?"Speed tie":`${(spd1>spd2?m1:m2).species} is faster`;

  const app={minHeight:"100vh",width:"100%",color:C.text,
    background:"linear-gradient(165deg,#06130d 0%,#0a1f16 55%,#071711 100%)",
    fontFamily:"ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"};

  return <div style={app}>
    <div style={{maxWidth:560,margin:"0 auto",padding:"18px 16px 44px"}}>
      <header style={{marginBottom:4}}>
        <div style={{fontSize:11,fontWeight:800,letterSpacing:".16em",textTransform:"uppercase",color:C.accent}}>Pokémon Emerald · Battle Frontier</div>
        <h1 style={{fontSize:24,fontWeight:900,margin:"4px 0 0"}}>Matchup Calculator</h1>
        <p style={{color:C.muted,fontSize:13,margin:"6px 0 0"}}>Gen III sets — real stats from base/IV/EV/nature, four moves each, both directions.</p>
      </header>

      <div style={{...cardS,display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1}}>
          <label style={lbl}>Weather</label>
          <Sel value={weather} onChange={setWeather} options={["None","Sun","Rain"]}/>
        </div>
        <div style={{flex:1,textAlign:"right"}}>
          <div style={lbl}>Speed</div>
          <div style={{fontSize:13,fontWeight:800,color:C.accent}}>{faster}</div>
          <div style={{...mono,fontSize:11,color:C.muted}}>{spd1} vs {spd2}</div>
        </div>
      </div>

      <ResultPanel atk={m1} def={m2} weather={weather} title="▶"/>
      <ResultPanel atk={m2} def={m1} weather={weather} title="◀"/>

      <MonCard mon={m1} onChange={setM1} idx={1}/>
      <MonCard mon={m2} onChange={setM2} idx={2}/>

      <p style={{fontSize:12,color:C.muted,lineHeight:1.6,marginTop:16}}>
        ADV rules: a move's category (physical/special) follows its type, so Shadow Ball is physical and Crunch is special.
        Crits deal 2×, ignoring screens and unfavorable stat stages. Level 50 mode is the default — change a level for Open Level.
        Base powers use Gen III values (Meteor Mash 100, Outrage 90, Leaf Blade 70). Pick "Custom" on any move slot for something not listed, including Hidden Power.
      </p>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
